# Clippy policy. Lint levels live in Cargo.toml [workspace.lints]; this file
# sets the analysis thresholds shared by the workspace and the separate
# archived local reference workspace under .local/extras. Test-only allowances are restricted to test
# code and do not weaken production lints.

# Fail instead of silently preserving a semver-breaking public API.
avoid-breaking-exported-api = false

# Project MSRV matches rust-toolchain.toml and Cargo.toml.
msrv = "1.99"

# Complexity and size limits. Values are strict but compatible
# with financial state machines and protocol decoders.
cognitive-complexity-threshold = 20
too-many-arguments-threshold = 7
too-many-lines-threshold = 150
type-complexity-threshold = 250
single-char-binding-names-threshold = 4

# Tests may use unwrap/expect/panic/print/dbg for assertions and diagnostics;
# library and binary targets remain denied by [workspace.lints.clippy].
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-print-in-tests = true
allow-dbg-in-tests = true
allow-indexing-slicing-in-tests = true

name: CI
# Also reusable, so release.yml can make these gates a precondition of any tag
# publication rather than a workflow that runs alongside it.
on:
  push:
    # Pull requests run the suite too; restricting push to the default branch
    # avoids running every job twice for a branch under review.
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Compile all workspace targets
        run: cargo check --workspace --all-targets --locked
      - name: Architecture, waivers and claims
        run: cargo xtask check
      - name: Install cargo-deny
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - name: Dependency policy
        run: cargo deny check
      - name: Tests
        run: cargo test --workspace --all-targets --locked
      # The fundamental-tools validate-facts/validate-companies step ran
      # against invented example fixtures and was removed under the
      # 2026-11-23 test-policy record. Do not restore it without an owner
      # decision; the Python vector gate above still checks fact fixtures.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
  compile-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: Measure cold workspace compile cost
        run: python3 scripts/check_compile_budget.py
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned C++ formatter
        run: python -m pip install --disable-pip-version-check clang-format==21.1.8
      - name: Check C/C++ formatting
        run: |
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hxx' \
            | xargs -0 --no-run-if-empty clang-format --style=file --dry-run --Werror
      - name: Configure numeric oracle
        run: cmake -S verification/cpp-oracle -B build/cpp-oracle -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - name: Build numeric oracle
        run: cmake --build build/cpp-oracle --parallel 2
      - name: Test numeric oracle
        run: ctest --test-dir build/cpp-oracle --output-on-failure
  source-style:
    runs-on: ubuntu-latest
    env:
      NIRNAY_STYLE_BASE: origin/main
    steps:
      # Full history is required so the added-lines gates can diff against main.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff
        run: python3 -m pip install --disable-pip-version-check -r ruff-requirements.txt
      - name: Rust style guidance on added lines
        run: python3 scripts/check_rust_style.py
      - name: Python/C++/Shell/Makefile/JSON/Markdown style on added lines
        run: python3 scripts/check_source_style.py
      - name: Ruff on added Python lines
        run: |
          python3 scripts/ruff_gate.py scripts/check_ruff_added_lines.py scripts/check_quality_contract.py scripts/check_style_references.py scripts/check_license_provenance.py scripts/ruff_gate.py
          python3 scripts/check_ruff_added_lines.py --self-test
          python3 scripts/check_ruff_added_lines.py
      - name: Prose style on added lines
        run: |
          python3 scripts/check_prose_style.py
          python3 scripts/check_prose_unified.py --self-test
          python3 scripts/check_prose_unified.py
      - name: q / kdb+ style on added lines
        run: python3 scripts/check_q_style.py
      - name: ShellCheck and tool isolation
        run: |
          python3 scripts/check_shellcheck.py
          python3 scripts/check_generated_paths.py
          python3 scripts/check_no_cross_pollution.py
      - name: Frozen source-ingestion boundary
        run: make freeze-check

      - name: Documentation lifecycle
        run: |
          python3 scripts/check_docs.py --self-test
          python3 scripts/check_docs.py
      - name: Git policy
        run: python3 scripts/check_git_policy.py
      - name: Style reference integrity
        run: |
          python3 scripts/check_style_references.py --self-test
          python3 scripts/check_style_references.py
      - name: Shared quality contract
        run: |
          python3 scripts/check_quality_contract.py --self-test
          python3 scripts/check_quality_contract.py
      - name: License and provenance
        run: |
          python3 scripts/check_license_provenance.py --self-test
          python3 scripts/check_license_provenance.py
      - name: Style gate self-tests
        run: |
          python3 scripts/check_rust_style.py --self-test
          python3 scripts/check_source_style.py --self-test
          python3 scripts/check_prose_style.py --self-test
          python3 scripts/check_style_gate.py --self-test
      - name: Style gate integrity
        run: python3 scripts/check_style_gate.py
  python-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/python/pyproject.toml
      - name: Install pinned research environment
        run: |
          python -m pip install -r constraints/python-research.txt
          python -m pip install --no-deps -e research/python
      - name: Audit research dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python scripts/supply_chain.py audit research
      - name: Require PyArrow
        run: python -c "import pyarrow; print('pyarrow', pyarrow.__version__)"
      # The Parquet round-trip test consumed market-shaped synthetic events and
      # was withdrawn under the 2026-11-23 test-policy record. Do not restore it
      # without an owner decision. PyArrow availability remains checked above.
      - name: Research and repository tests
        run: python -m pytest -q research/python/tests scripts
      - name: Compile Python sources
        run: python -m compileall -q research/python scripts ops
      # check_repo.py::run invokes `cargo metadata` for its architecture gate.
      # Pin the toolchain so runner-ambient cargo cannot fail on the edition
      # 2024 manifests and produce intermittent red gates.
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
      - name: Repository policy
        run: python scripts/check_repo.py check
      - name: Style gate integrity
        run: python3 scripts/check_style_gate.py
      - name: D11 synthetic-market source policy
        run: |
          python3 scripts/check_synthetic_market_policy.py --self-test
          python3 scripts/check_synthetic_market_policy.py
      - name: Schema and contract validation
        run: python scripts/validate_contracts.py
  python-provider:
    # Named explicitly: without this the check appears as `python-provider
    # (apps/kite-ops, kite, kite-ops, constraints/…)`, which is unusable in a
    # required-checks rule.
    name: python-provider (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: apps/kite-ops
            name: kite
            audit_env: kite-ops
            constraints: constraints/python-kite-ops.txt
          - package: apps/fyers-recorder
            name: fyers
            audit_env: fyers-recorder
            constraints: constraints/python-fyers-recorder.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - name: Install ${{ matrix.name }} in an isolated pinned environment
        run: |
          python -m pip install -r ${{ matrix.constraints }}
          python -m pip install --no-deps -e '${{ matrix.package }}[test]'
      - name: Audit ${{ matrix.name }} dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python scripts/supply_chain.py audit ${{ matrix.audit_env }}
      - name: Check ${{ matrix.name }} dependency consistency
        run: python -m pip check
      - name: Run ${{ matrix.name }} tests
        run: python -m pytest -q ${{ matrix.package }}/tests
      - name: Compile ${{ matrix.name }} sources
        run: python -m compileall -q ${{ matrix.package }}
  provider-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # fyers-apiv3==3.2.1 pins requests==2.31.0 while nirnay-kite-ops requires
      # requests>=2.32,<3. The providers therefore ship in isolated
      # environments. This canary fails if the conflict disappears, so the
      # isolation and documentation must be revisited rather than left stale.
      - name: Confirm the known provider dependency conflict
        run: |
          set +e
          python -m pip install --dry-run -e apps/fyers-recorder -e apps/kite-ops > combined.log 2>&1
          status=$?
          set -e
          cat combined.log
          if [ "$status" -eq 0 ]; then
            echo "::error::The combined provider install now resolves. Remove the isolation and update engineering/provider-environments.md."
            exit 1
          fi
          grep -q 'requests' combined.log
          echo "Known fyers-apiv3 requests pin confirmed; providers remain isolated."
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install constraint checker
        run: python -m pip install --disable-pip-version-check packaging
      - name: Verify workflow actions are pinned to commit SHAs
        run: python scripts/supply_chain.py pins
      - name: Verify resolved constraint sets
        run: python scripts/supply_chain.py constraints
      - name: Generate SBOM
        run: python scripts/supply_chain.py sbom sbom.cdx.json
      - name: Record SBOM digest
        run: |
          python - <<'PY'
          import hashlib, pathlib
          data = pathlib.Path('sbom.cdx.json').read_bytes()
          print('sbom.cdx.json sha256', hashlib.sha256(data).hexdigest())
          PY
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # The r2 wheels carried stale __pycache__ entries from a reused build
      # directory. Build from a clean tree so the check cannot be satisfied by
      # leftovers, then inspect every archive member.
      - name: Remove stale build output
        run: |
          rm -rf build dist research/python/build apps/kite-ops/build apps/fyers-recorder/build
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name '*.egg-info' -prune -exec rm -rf {} +
      - name: Build the three wheels
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build --wheel research/python --outdir dist
          python -m build --wheel apps/kite-ops --outdir dist
          python -m build --wheel apps/fyers-recorder --outdir dist
      - name: Reject cache entries and prove clean installs
        run: python scripts/check_wheels.py --dist dist
  macos:
    # `macos-14` no longer provisions a runner (the job is cancelled before any
    # step starts); `macos-latest` does, and the first step asserts arm64.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Verify Apple silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          sw_vers
      # The shared numeric sources use __int128, which is a GCC/Clang 64-bit
      # extension. Linux GCC and macOS AppleClang are separate contracts.
      - name: Rust format and tests on Apple silicon
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo test --workspace --all-targets --locked
      - name: Configure numeric oracle with AppleClang
        run: cmake -S verification/cpp-oracle -B build/cpp-oracle -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++
      - name: Build and test numeric oracle
        run: |
          cmake --build build/cpp-oracle --parallel 2
          ctest --test-dir build/cpp-oracle --output-on-failure
      # The Keychain helper is shipped as Swift source inside the wheel and
      # invoked with `swift`; both its typecheck and its compiled form are
      # verified here because this is the only platform where it can run.
      - name: Typecheck and compile the Keychain helper
        run: |
          mkdir -p build
          xcrun swiftc -version
          xcrun swiftc -typecheck apps/kite-ops/src/kite_ops/native/keychain.swift
          xcrun swiftc -O apps/kite-ops/src/kite_ops/native/keychain.swift -o build/nirnay-keychain-helper
          lipo -archs build/nirnay-keychain-helper
          file build/nirnay-keychain-helper
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build and verify wheels on macOS
        run: |
          rm -rf dist research/python/build apps/kite-ops/build apps/fyers-recorder/build
          python -m pip install --disable-pip-version-check build
          python -m build --wheel research/python --outdir dist
          python -m build --wheel apps/kite-ops --outdir dist
          python -m build --wheel apps/fyers-recorder --outdir dist
          python scripts/check_wheels.py --dist dist

  numeric-differential:
    name: Pure numeric Rust/C++ differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
      - name: Build C++ oracle drivers
        run: |
          cmake -S verification/cpp-oracle -B build/diff-oracle \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build/diff-oracle --parallel 2
      - name: Build Rust conformance driver
        run: cargo build -p market-types --bin numeric_driver --locked
      - name: Compare canonical outputs byte for byte
        run: |
          python3 scripts/check_numeric_differential.py \
            --corpus verification/corpus \
            --cpp-numeric build/diff-oracle/nirnay_numeric_driver \
            --rust-numeric target/debug/numeric_driver \
            --report build/diff-oracle/differential-report.json

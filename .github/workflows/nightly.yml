name: Nightly
on:
  schedule:
    - cron: "23 2 * * 1-5"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo xtask check
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny
      - run: cargo deny check
      - run: cargo test --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
  cpp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check clang-format==21.1.8
      - name: Check C/C++ formatting
        run: |
          git ls-files -z -- '*.c' '*.cc' '*.cpp' '*.cxx' '*.h' '*.hpp' '*.hxx' \
            | xargs -0 --no-run-if-empty clang-format --style=file --dry-run --Werror
      - run: cmake -S tests/oracles/cpp-numeric -B build/cpp-oracle -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
      - run: cmake --build build/cpp-oracle --parallel 2
      - run: ctest --test-dir build/cpp-oracle --output-on-failure
  python-research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: research/python/pyproject.toml
      - name: Install pinned research environment
        run: |
          python -m pip install -r constraints/python-research.txt
          python -m pip install --no-deps -e research/python
      - name: Install audit tooling
        run: python -m pip install --disable-pip-version-check pip-audit packaging
      - name: Verify workflow actions are pinned
        run: python scripts/supply_chain.py pins
      - name: Verify resolved constraint sets
        run: python scripts/supply_chain.py constraints
      - name: Audit research dependencies
        run: python scripts/supply_chain.py audit research
      - name: Generate SBOM
        run: python scripts/supply_chain.py sbom sbom.cdx.json
      - run: python -c "import pyarrow; print('pyarrow', pyarrow.__version__)"
      - run: python -m pytest -q research/python/tests/test_market_pipeline.py -k parquet
      - run: python -m pytest -q research/python/tests scripts
      - run: python -m compileall -q research/python scripts ops
      - run: python scripts/check_repo.py check
      - run: python scripts/validate_contracts.py
  python-provider:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: apps/kite-ops
            name: kite
            audit_env: kite-ops
            constraints: constraints/python-kite-ops.txt
          - package: apps/fyers-recorder
            name: fyers
            audit_env: fyers-recorder
            constraints: constraints/python-fyers-recorder.txt
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.package }}/pyproject.toml
      - name: Install pinned provider environment
        run: |
          python -m pip install -r ${{ matrix.constraints }}
          python -m pip install --no-deps -e '${{ matrix.package }}[test]'
      - name: Audit provider dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python scripts/supply_chain.py audit ${{ matrix.audit_env }}
      - run: python -m pip check
      - run: python -m pytest -q ${{ matrix.package }}/tests
      - run: python -m compileall -q ${{ matrix.package }}

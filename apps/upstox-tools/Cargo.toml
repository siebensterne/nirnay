[package]
name = "upstox-tools"
version = "0.4.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[[bin]]
name = "upstox-smoke"
path = "src/bin/upstox_smoke.rs"

[[bin]]
name = "upstox-recorder"
path = "src/bin/upstox_recorder.rs"

[[bin]]
name = "upstox-decode-export"
path = "src/bin/upstox_decode_export.rs"

[[bin]]
name = "upstox-verify-session"
path = "src/bin/upstox_verify_session.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
futures-util.workspace = true
jiff.workspace = true
market-archive.workspace = true
market-event.workspace = true
market-kernel.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
upstox-feed-proto.workspace = true

[lints]
workspace = true

[[bin]]
name = "upstox-kernel-session"
path = "src/bin/upstox_kernel_session.rs"

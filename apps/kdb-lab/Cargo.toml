[package]
name = "kdb-lab"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Checked-in KDB-X analytics contract, runner and deterministic golden harness"

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[[bin]]
name = "nirnay-kdb"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "q_replay"
path = "tests/q_replay.rs"
required-features = ["market-shaped-tests"]

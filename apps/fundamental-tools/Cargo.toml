[package]
name = "fundamental-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Validation tools for Nirnay corporate financial fact datasets"

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[[bin]]
name = "nirnay-fundamental"
path = "src/main.rs"

[dependencies]
clap.workspace = true
fundamental-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
jiff.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Retained after D11: pure contract-vector and arbitrary-byte checks.
[[test]]
name = "contract"
path = "tests/contract.rs"

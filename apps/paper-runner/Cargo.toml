[package]
name = "paper-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Bounded end-to-end paper/shadow certification harness"

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
authoritative-oms.workspace = true
broker-adapter.workspace = true
market-event.workspace = true
market-kernel.workspace = true
ops-runtime.workspace = true
risk-authority.workspace = true
risk-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
strategy-runtime.workspace = true
trading-core.workspace = true

[dev-dependencies]
account-journal.workspace = true
cost-model.workspace = true
paper-engine.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# D11: retained manifest-boundary audit checks; recovery drill retired.
[[test]]
name = "certification"
path = "tests/certification.rs"

# Neutral, std-workload benchmark of real production components. The source
# lives in the workspace-level benches/ directory; all required crates are
# already declared above, so no dependency is added.
[[bench]]
name = "production_components"
path = "../../benches/production_components.rs"
harness = false

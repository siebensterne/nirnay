# Nirnay: private systematic-trading research and execution workspace.
# Virtual workspace. Archived predecessor material lives outside version control
# under .local/extras and is not part of any build or CI job.
[workspace]
resolver = "3"
members = ["crates/*", "apps/cost-cli", "apps/upstox-tools", "apps/fundamental-tools", "apps/fyers-importer", "apps/paper-runner", "apps/kdb-lab", "xtask"]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# Internal crates
account-journal = { path = "crates/account-journal", version = "0.1.0" }
cost-model = { path = "crates/cost-model", version = "0.1.0" }
execution-policy = { path = "crates/execution-policy", version = "0.1.0" }
india-domain = { path = "crates/india-domain", version = "0.1.0" }
market-archive = { path = "crates/market-archive", version = "0.1.0" }
market-event = { path = "crates/market-event", version = "0.1.0" }
market-kernel = { path = "crates/market-kernel", version = "0.1.0" }
strategy-runtime = { path = "crates/strategy-runtime", version = "0.1.0" }
risk-authority = { path = "crates/risk-authority", version = "0.1.0" }
authoritative-oms = { path = "crates/authoritative-oms", version = "0.1.0" }
broker-adapter = { path = "crates/broker-adapter", version = "0.1.0" }
ops-runtime = { path = "crates/ops-runtime", version = "0.1.0" }
paper-runner = { path = "apps/paper-runner", version = "0.1.0" }
market-book = { path = "crates/market-book", version = "0.1.0" }
market-types = { path = "crates/market-types", version = "0.1.0" }
upstox-feed-proto = { path = "crates/upstox-feed-proto", version = "0.1.0" }
paper-engine = { path = "crates/paper-engine", version = "0.1.0" }
risk-engine = { path = "crates/risk-engine", version = "0.1.0" }
trading-core = { path = "crates/trading-core", version = "0.1.0" }
fundamental-domain = { path = "crates/fundamental-domain", version = "0.1.0" }

# External dependencies (single version policy; members inherit these entries)
anyhow = "1"
base64 = "0.22"
blake3 = "1"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0", features = ["pkcs8", "pem", "rand_core"] }
fs2 = "0.4"
futures-util = "0.3"
jiff = { version = "=1.0.0", features = ["serde"] }
prost = "=0.14.4"
prost-build = "=0.14.4"
protoc-bin-vendored = "=3.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sha2 = "0.10"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tempfile = "3"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = "deny"

[workspace.lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
redundant_else = "deny"
needless_raw_string_hashes = "deny"

# Development and test builds keep source-line backtraces without emitting
# full DWARF for every dependency. This is the dominant cost of the workspace
# test/link cycle and does not affect runtime behaviour or release quality.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.test]
debug = "line-tables-only"
incremental = true

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[package]
name = "execution-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Signed execution permits and execution-mode policy."

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
anyhow.workspace = true
ed25519-dalek.workspace = true
jiff.workspace = true
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "execution_policy"
path = "tests/execution_policy.rs"
required-features = ["market-shaped-tests"]

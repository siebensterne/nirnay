[package]
name = "release-verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Independent Nirnay verifier for immutable NDC v2 release packages"
# The B16 acceptance harness runs inside the crate so it can use crate-private
# test profiles. It is included from `src/lib.rs` under `cfg(test)`.
autotests = false

[[test]]
name = "verifier"
path = "tests/verifier.rs"

[[test]]
name = "canonical_wire"
path = "tests/canonical_wire.rs"

[[test]]
name = "contract_conformance"
path = "tests/contract_conformance.rs"

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
flate2.workspace = true
libc.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

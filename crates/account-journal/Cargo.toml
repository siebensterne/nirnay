[package]
name = "account-journal"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Append-only account-event journal with a BLAKE3 hash chain."

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
blake3.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
trading-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "fencing_boundary"
path = "tests/fencing_boundary.rs"

[[test]]
name = "journal"
path = "tests/journal.rs"
required-features = ["market-shaped-tests"]

[[bin]]
name = "paper-run"
path = "src/bin/paper_run.rs"

[package]
name = "paper-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Deterministic paper-trading order lifecycle."

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
account-journal.workspace = true
anyhow.workspace = true
clap.workspace = true
cost-model.workspace = true
market-types.workspace = true
risk-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
trading-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "capsule"
path = "tests/capsule.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "engine"
path = "tests/engine.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "liquidity"
path = "tests/liquidity.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "paper_run"
path = "tests/paper_run.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "provenance"
path = "tests/provenance.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "venue_matching"
path = "tests/venue_matching.rs"
required-features = ["market-shaped-tests"]

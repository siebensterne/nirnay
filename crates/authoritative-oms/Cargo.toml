[package]
name = "authoritative-oms"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "One authoritative transactional OMS with outbox and UNKNOWN reconciliation"

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
account-journal.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
trading-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "fencing_boundary"
path = "tests/fencing_boundary.rs"

[[test]]
name = "account_ledger"
path = "tests/account_ledger.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "durability"
path = "tests/durability.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "fill_events"
path = "tests/fill_events.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "lifecycle"
path = "tests/lifecycle.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "performance"
path = "tests/performance.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "permit_binding"
path = "tests/permit_binding.rs"
required-features = ["market-shaped-tests"]

[package]
name = "upstox-feed-proto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
market-event.workspace = true
prost.workspace = true
thiserror.workspace = true

[dev-dependencies]
base64.workspace = true
serde_json.workspace = true
sha2.workspace = true

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "decoder"
path = "tests/decoder.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "mbp"
path = "tests/mbp.rs"
required-features = ["market-shaped-tests"]

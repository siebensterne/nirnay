[package]
name = "market-book"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Venue-neutral order-book representation."

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
market-types.workspace = true
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "mbp"
path = "tests/mbp.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "reconciliation"
path = "tests/reconciliation.rs"
required-features = ["market-shaped-tests"]

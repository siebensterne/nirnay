[package]
name = "sbe-codec"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Self-contained decoder for the challenge SBE order-book schema"

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[lib]
name = "sbe_codec"
path = "src/lib.rs"

[dependencies]
thiserror.workspace = true

[dev-dependencies]
sha2.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "differential"
path = "tests/differential.rs"
required-features = ["market-shaped-tests"]

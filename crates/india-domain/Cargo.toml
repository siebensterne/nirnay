[package]
name = "india-domain"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "India-specific instrument, listing and effective-dated market terms."

# A permitted sibling target exists, so targets are declared explicitly.
autotests = false

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
anyhow.workspace = true
jiff.workspace = true
serde.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "temporal_compat"
path = "tests/temporal_compat.rs"

[[test]]
name = "india_domain"
path = "tests/india_domain.rs"
required-features = ["market-shaped-tests"]

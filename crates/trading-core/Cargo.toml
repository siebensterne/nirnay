[package]
name = "trading-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Trading contracts and exact financial primitives; currently India-aware."

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
anyhow.workspace = true
india-domain.workspace = true
jiff.workspace = true
market-types.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "contracts"
path = "tests/contracts.rs"
required-features = ["market-shaped-tests"]

# Neutral, std-only benchmark harness. The source lives in the workspace-level
# benches/ directory; enabling market-shaped-tests is neither required nor used.
[[bench]]
name = "neutral_decisions"
path = "../../benches/neutral_decisions.rs"
harness = false

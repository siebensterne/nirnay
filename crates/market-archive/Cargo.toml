[package]
name = "market-archive"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Validated raw-frame journal and stream-continuity accounting."

# A permitted sibling target exists, so targets are declared explicitly.
autotests = false

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
base64.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "capability"
path = "tests/capability.rs"

[[test]]
name = "ingress"
path = "tests/ingress.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "performance"
path = "tests/performance.rs"
required-features = ["market-shaped-tests"]

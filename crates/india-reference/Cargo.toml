[package]
name = "india-reference"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Bounded India exchange reference-data ingestion and identity resolution"

[features]
# Opt-in only: market-shaped test source and gated integration targets.
# Never enabled by default or by any gate command. See the test-policy record.
market-shaped-tests = []

[dependencies]
anyhow.workspace = true
fs2.workspace = true
india-domain.workspace = true
jiff.workspace = true
market-types.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
trading-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true

# Integration targets are declared explicitly under the test policy.
[[test]]
name = "durability"
path = "tests/durability.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "ingestion"
path = "tests/ingestion.rs"
required-features = ["market-shaped-tests"]

[[test]]
name = "source_conformance"
path = "tests/source_conformance.rs"
required-features = ["market-shaped-tests"]

[pytest]
minversion = 8.0
testpaths =
    research/python/tests
    apps/fyers-recorder/tests
    apps/kite-ops/tests
    scripts
norecursedirs =
    .git
    .legacy
    extras
    target
    .venv
    venv
    build
    dist
    __pycache__
    .pytest_cache
pythonpath =
    research/python/src
    apps/fyers-recorder/src
    apps/kite-ops/src
    scripts
addopts = -ra
markers =
    market_shaped_fixture: historical marker retained for detection of legacy synthetic market-shaped fixture consumers; no longer an active deselection expression under owner directive D11

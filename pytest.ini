[pytest]
minversion = 8.0
testpaths =
    research/python/tests
    apps/fyers-recorder/tests
    apps/kite-ops/tests
    scripts
norecursedirs =
    .git
    .legacy
    extras
    target
    .venv
    venv
    build
    dist
    __pycache__
    .pytest_cache
pythonpath =
    research/python/src
    apps/fyers-recorder/src
    apps/kite-ops/src
    scripts
addopts = -ra -m "not market_shaped_fixture"
markers =
    market_shaped_fixture: historical marker for synthetic market-shaped fixture consumers; retired under owner directive D11, kept only so old synthetic tests remain detectable and rejected

# Python formatter settings for the repository's gate scripts.
#
# Pyink is Google's Black fork and is the formatter named by the Google Python
# Style Guide. Ruff's lint policy lives in ruff.toml; both tools are pinned in
# requirements-dev.txt and invoked by `cargo xtask style`.
[tool.pyink]
line-length = 80
pyink-indentation = 4
pyink-use-majority-quotes = true
